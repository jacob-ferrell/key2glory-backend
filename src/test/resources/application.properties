# In-memory database so tests never touch PostgreSQL
spring.datasource.url=jdbc:h2:mem:key2glory;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JwtDecoder is mocked in tests; these just need to resolve
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://example.invalid/
spring.security.oauth2.resourceserver.jwt.audiences=test-audience
auth0.audience=test-audience
resource-server.cors.allowed-origins=http://localhost:5174
